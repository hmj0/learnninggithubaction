name: caller_workflow

on:
    push:
        branches: [main]
    workflow_dispatch: 
        inputs:
            action: 
                type: choice
                required: true
                default: me
                options:
                    - me
                    - you

jobs:

    caller1:
        uses: ./.github/workflows/reusable-build.yml
        with:
            msg_artifact: 'Hello, je suis le fichier artifact a uploader dans le caller_workflow'

    caller2:
        needs: caller1
        env:
          OUTPUT_CALLER1: ${{needs.caller1.outputs.firstoutput}}
        runs-on: ubuntu-latest
        steps:
            - name: recuperation du output
              run: | 

                   echo "Affiche L'artifact"
                   echo "$OUTPUT_CALLER1" 
                


            
                       

                     