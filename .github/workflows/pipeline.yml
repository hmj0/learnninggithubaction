name: first

on:

    pull_request:
        branches: [main]
        types: [opened,synchronize]

permissions:
    contents: read


jobs:
    learn:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout du code
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 #v5

            - name: check checkout
              run: |

                    echo "On check le repo"
                    ls -ltrh
            - name: Contexte du lancement du pipeline
              run: |

                     echo "Nom du repo ${{github.repository}}"
                     echo "Nom de l'event qui declanche le pipeline ${{github.event_name}}"
                     echo "Nom du user qui declanche le workflow ${{github.actor}}"
                     echo "Nom de la branche ou le workflow est lance ${{github.ref_name}}"

            - name: Check Secret
              env:
                TEST_SECRETS: ${{secrets.TEST_SECRETS}}
              
              run: |

                     if [ -n "$TEST_SECRETS" ]; then
                        echo "Le secrets est non vide"
                     else
                        echo "Le secret es vide"
                     fi


                       
